<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
</head>
<body>
    <h1>List of books</h1>
    <ul>
    {% for book in books %}
        <li>
            <strong><a href="{{ url_for('show_book_profile', book_id=book[0]) }}">{{ book[1]|e }}</a></strong> - Written by: {{ book[2]|e }}
        </li>
    {% endfor %}    
    </ul>
    <br><br><br>
    <h3>Introduce books to the database</h3>
    <form action="/add_book" method="POST">
        <label>Name:</label>
        <input type="text" name="book_name" placeholder="Mistborn" required>
        <br><br>
        <label>Author:</label>
        <input type="text" name="author" placeholder="Brandon Sanderson" required>
        <br><br>
        <label>Genre:</label>
        <input type="text" name="genre" placeholder="Fantasy" required>
        <br><br>
        <button type="submit">Send</button>
    </form>
</body>
</html>
