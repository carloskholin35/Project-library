<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Library</title>
</head>
<body>
    <h1>List of books</h1>
    <ul>
    {% for book in books %}
        <li>
            <strong><a href="{{ url_for('show_book_profile', book_id=book[0]) }}">{{ book[1]|e }}</a></strong> - Written by: {{ book[2]|e }}
        </li>
    {% endfor %}    
    </ul>
    <br><br><br>
    <h3>Introduce books to the database</h3>
    <form action="/add_book" method="POST">
        <label>Name:</label>
        <input type="text" name="book_name" placeholder="Mistborn" required>
        <br><br>
        <label>Author:</label>
        <input type="text" name="author_name" placeholder="Brandon Sanderson" required>
        <br><br>
        <label>Cover:</label>
        <input type="text" name="cover_url" placeholder="portada.jpg" required>
        <br><br>
        <label>Publication year:</label>
        <input type="text" name="publication_year" placeholder="2006" required>
        <br><br>
        <label>Genre:</label>
        {% for genre in genres %}
        <input type="checkbox" id="genre-{{ genre[0] }}" name="genres[]" value="{{ genre[0] }}">
        <label for="genre-{{ genre[0] }}">{{ genre[1]|e }}</label>
        {% endfor %}  
        <br><br>
        <button type="submit">Send</button>
    </form>
</body>
</html>
