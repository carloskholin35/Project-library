<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ book[1]|e }}</title>
</head>
<body>
    <h1>{{ book[1]|e }}</h1>
    <span>{{ book[2]|e }}</span>
    <ul>
        <span>{{ book[3]|e }}</span>
    </ul>
    <br><br><br>
    <form action="{{ url_for('delete_book', book_id=book[0]) }}" method="POST">
        <button type="submit">Delete book?</button>
    </form>
    <br><br>
    <form action="{{ url_for('update_book', book_id=book[0]) }}" method="POST">
        <label>Name:</label>
        <input type="text" name="book_name" value="{{ book[1]|e }}" required>
        <br><br>
        <label>Author:</label>
        <input type="text" name="author" value="{{ book[2]|e }}" required>
        <br><br>
        <label>Genre:</label>
        <input type="text" name="genre" value="{{ book[3]|e }}" required>
        <br><br>
        <button type="submit">Send</button>
    </form>
</body>
</html>
