<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>{{ book[1]|e }}</title>
</head>
<body>
    <div id="cover">
        <img id="cover-url" src="{{ book[3]|e }}">
        <h1 id="title-book">{{ book[1]|e }}</h1>
        <span id="publication_year">{{ book[4]|e }}</span>
        <span id="author-book">{{ book[2]|e }}</span>
    </div>
    <div id="book-genres">
        <span>Genres</span>
        {% for g in book_genres %}
            <span class="genre-tag">{{ genre[1]|e }}</span>
        {% endfor %}
    </div>
    
    <br><br><br>
    <form action="{{ url_for('delete_book', book_id=book[0]) }}" method="POST">
        <button type="submit">Delete book?</button>
    </form>
    <br><br>
    <form action="{{ url_for('update_book', book_id=book[0]) }}" method="POST">
        <label>Name:</label>
        <input type="text" name="book_name" value="{{ book[1]|e }}" required>
        <br><br>
        <label>Author:</label>
        <input type="text" name="author_name" value="{{ book[2]|e }}" required>
        <br><br>
        <label>Genre:</label>
        {% [genre[0] for genre in genres] %}
            {% if genre in book_genres %}
                <input type="checkbox" id="genre-{{ genre[0] }}" name="genres[]" value="{{ genre[0] }}" checked>
                <label for="genre-{{ genre[0] }}">{{ genre[1]|e }}</label>
            {% endif %}
            <input type="checkbox" id="genre-{{ genre[0] }}" name="genres[]" value="{{ genre[0] }}">
            <label for="genre-{{ genre[0] }}">{{ genre[1]|e }}</label>
        {% endfor %}  
        <br><br>
        <label>Cover (URL):</label>
        <input type="text" name="cover_url" value="{{ book[3]|e }}" required>
        <br><br>
        <label>Publication year:</label>
        <input type="text" name="publication_year" value="{{ book[4]|e }}" required>
        <br><br>
        <button type="submit">Send</button>
    </form>
</body>
</html>
